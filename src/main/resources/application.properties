spring.application.name=casa-aurora
   # Usuario de los dueños (en Render se definen con variables de entorno)
   app.admin.usuario=${ADMIN_USER:ruth}
   app.admin.password=${ADMIN_PASSWORD:casaaurora-local}

   # Necesario para que HTTPS funcione bien detrás de Render y Vercel
   server.forward-headers-strategy=framework