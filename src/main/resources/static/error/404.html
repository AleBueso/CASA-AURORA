<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Casa Aurora</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7d1734">
  <style>
    :root { --vino:#7d1734; --vino-2:#a32a4c; --crema:#fbf7f4; --tinta:#2a171d; --gris:#6e6166; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background:var(--crema); color:var(--tinta); text-align:center; padding:24px; }
    .codigo { font-size:6rem; font-weight:800; color:var(--vino); line-height:1; margin:0; }
    h1 { font-size:1.6rem; margin:12px 0; }
    p { color:var(--gris); max-width:420px; margin:0 auto 28px; }
    .btn { display:inline-block; padding:12px 22px; border-radius:8px; background:var(--vino);
           color:#fff; text-decoration:none; font-weight:600; }
    .btn:hover { background:var(--vino-2); }
    @media (max-width: 480px) { .codigo { font-size:4.5rem; } h1 { font-size:1.3rem; } }
  </style>
</head>
<body>
  <main>
    <p class="codigo">404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Volvé al inicio para seguir navegando.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </main>
</body>
</html>
