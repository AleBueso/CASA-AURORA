<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Casa Aurora</title>
  <meta name="description" content="Acceso privado al panel de gestión de Casa Aurora.">
  <meta name="theme-color" content="#621A29">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --arena:#E6D3A1; --crema:#FBF6EA; --carbon:#192023; --vino:#621A29; --vino-2:#7A2236; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:"Lora", Georgia, serif; background:var(--arena); color:var(--carbon); padding:24px; }
    .tarjeta { width:100%; max-width:400px; background:var(--crema); border-radius:12px; padding:36px 32px;
               box-shadow:0 10px 30px rgba(25,32,35,.15); border-top:6px solid var(--vino); text-align:center; }
    .tarjeta img { width:88px; height:88px; }
    h1 { font-family:"Oswald", sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:1.6rem; margin:12px 0 4px; }
    .sub { font-style:italic; color:var(--vino); margin:0 0 24px; }
    form { text-align:left; }
    label { display:block; font-weight:600; margin:14px 0 6px; font-size:.95rem; }
    input { width:100%; padding:12px; font-size:1rem; border:1px solid #cdbf98; border-radius:6px; background:#fff; font-family:inherit; }
    input:focus { outline:2px solid var(--vino); border-color:var(--vino); }
    button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:6px; background:var(--vino); color:var(--crema);
             font-family:"Oswald", sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:1rem; cursor:pointer; }
    button:hover { background:var(--vino-2); }
    button:disabled { opacity:.6; cursor:wait; }
    .aviso { display:none; padding:10px 12px; border-radius:6px; margin-bottom:8px; font-size:.95rem; text-align:left; }
    .error { background:#f6dcdf; color:#7a1a2a; }
    .ok { background:#e2efe0; color:#285a2b; }
    .volver { display:inline-block; margin-top:20px; color:var(--carbon); font-size:.9rem; }
    @media (max-width: 480px) { .tarjeta { padding:28px 20px; } h1 { font-size:1.35rem; } }
  </style>
</head>
<body>
  <main class="tarjeta">
    <img src="/img/logo-monograma.png" alt="Monograma de Casa Aurora">
    <h1>Panel de gestión</h1>
    <p class="sub">Acceso exclusivo para los dueños</p>

    <div id="error" class="aviso error" role="alert">Usuario o contraseña incorrectos.</div>
    <div id="salida" class="aviso ok" role="status">Cerraste sesión correctamente.</div>

    <form id="form-login" method="post" action="/login">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <input type="hidden" id="csrf">
      <button id="entrar" type="submit">Iniciar sesión</button>
    </form>

    <a class="volver" href="/">← Volver al inicio</a>
  </main>

  <script>
    const error = document.getElementById("error");
    const salida = document.getElementById("salida");
    const boton = document.getElementById("entrar");
    const form = document.getElementById("form-login");

    if (new URLSearchParams(location.search).has("logout")) salida.style.display = "block";

    // Token CSRF de seguridad para que el formulario se pueda enviar
    function cargarCsrf() {
      return fetch("/api/csrf", { credentials: "same-origin", cache: "no-store" })
        .then((r) => r.json())
        .then((d) => {
          const campo = document.getElementById("csrf");
          campo.name = d.parametro;
          campo.value = d.token;
        });
    }
    cargarCsrf();

    // Envío del login sin recargar la página: el servidor responde {ok:true} o 401
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (boton.disabled) return;
      boton.disabled = true;
      boton.textContent = "Ingresando…";
      error.style.display = "none";
      salida.style.display = "none";
      try {
        const r = await fetch("/login", {
          method: "POST",
          body: new URLSearchParams(new FormData(form)),
          credentials: "same-origin",
          headers: { "Accept": "application/json" }
        });
        if (r.ok) {
          location.href = "/admin";
          return;
        }
        error.style.display = "block";
      } catch (err) {
        error.textContent = "No se pudo conectar. Intentá de nuevo.";
        error.style.display = "block";
      }
      await cargarCsrf();
      boton.disabled = false;
      boton.textContent = "Iniciar sesión";
    });
  </script>
</body>
</html>
